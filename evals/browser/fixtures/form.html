<!doctype html><meta charset="utf-8"><title>a form that writes</title>
<h1>add a person</h1>
<label for="who">Name</label><input id="who" aria-label="Name">
<button id="save">Save</button>
<p id="count">0 saved</p>
<script>
  // The saved rows are fetched, never held in the DOM -- so the only channel that can
  // witness a write is the one that did not perform it.
  document.getElementById('save').addEventListener('click', async () => {
    const who = document.getElementById('who').value;
    await fetch('rows.json?name=' + encodeURIComponent(who));
    const rows = await (await fetch('rows.json')).json();
    document.getElementById('count').textContent = rows.length + ' saved';
  });
</script>
