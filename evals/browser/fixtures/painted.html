<!doctype html><meta charset="utf-8"><title>painted surface</title>
<h1>values are drawn</h1>
<canvas id="sheet" width="420" height="90"></canvas>
<button id="save">Save</button>
<script>
  // Neither channel can reach these: no node carries them and nothing was fetched.
  const c = document.getElementById('sheet').getContext('2d');
  c.font = '14px system-ui';
  [['883973','Ada Lovelace','Analytical'], ['883974','Grace Hopper','Harvard']]
    .forEach((row, i) => c.fillText(row.join('    '), 10, 30 + i * 26));
</script>
