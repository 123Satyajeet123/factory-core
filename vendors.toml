# Source-vendored projects. The only place a revision is written down.
# PyPI dependencies live in pyproject.toml; uv.lock pins them.
#
# tier  1 depend · 2 extend · 3 patch · 4 read
# use   how the code reaches us. An import is not the only way to depend on a
#       project, and a gate that inspects only imports cannot see the other three.
#       import | spawn | format | read

[[vendor]]
name    = "browser-use"
tier    = 3
use     = "import"
url     = "https://github.com/browser-use/browser-use.git"
rev     = "b4bad86d21bf693b9ae5748b667fc32fc8b8e7d5"
path    = "candidates/browser-use"
license = "MIT"
imports = "browser_use"
patch   = "candidates/browser-use-openai-pin.patch"
why     = "the BROWSER actuator; three patches ride its own extension points"

