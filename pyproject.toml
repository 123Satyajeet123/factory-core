[project]
name = "factory"
version = "0.1.0"
requires-python = ">=3.12"
description = "Turns a demonstrated browser workflow into work that proves itself."
# Versions are resolved and pinned by uv.lock. Anything imported is declared here.
dependencies = [
    "playwright",         # BROWSER: attach, role+name resolution, raw CDP, bodies
    "mcp",
    "openadapt-flow",
    "apscheduler",
    "pydantic",
    "structlog",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.scripts]
factory = "factory.main:main"

# Even our own reader arrives through the socket. Importing it by name inside `witness/`
# would be a back door, and the first thing to use it would be the next reader somebody
# was in a hurry to add.
[project.entry-points."factory.witness.readers"]
fetched = "factory.witness.readers.fetched:Fetched"

[dependency-groups]
dev = ["ruff", "pytest"]
# `outside-reader` is not a dependency of the product. It is a reader published from
# outside the tree, so `evals/witness/socket_eval.py` can prove the entry point group is a
# socket rather than a decoration.
evals = ["inspect-ai", "outside-reader"]

[tool.uv]
# `uv sync` is the whole build (principle 13). Without this the evals group is not
# installed, `outside-reader` is missing, and `evals/witness/socket_eval.py` fails on a
# fresh clone -- proving the entry point group is a socket needs a reader published from
# outside the tree to actually be there.
default-groups = ["dev", "evals"]

[tool.uv.sources]
outside-reader = { path = "evals/witness/outside", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
# COLLECTION IS DELIBERATELY EMPTY. See gates/when-evals-run.md. Evals launch browsers,
# spawn interpreters and bind ports; that is not something to have happening under somebody
# who is editing. They are run by name.
# An empty `testpaths` makes pytest fall back to the root and collect the VENDORED tests
# under candidates/, so it names a real directory and excludes the clones instead.
testpaths = ["evals"]
norecursedirs = ["candidates", "node_modules", ".venv", ".venv-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
