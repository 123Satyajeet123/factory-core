[project]
name = "factory"
version = "0.1.0"
requires-python = ">=3.12"
description = "Turns a demonstrated browser workflow into work that proves itself."
# Versions are resolved and pinned by uv.lock. Anything imported is declared here.
dependencies = [
    "playwright",         # BROWSER: attach, role+name resolution, raw CDP, bodies
    "mcp",
    "litellm",
    "instructor",
    "openadapt-flow",
    "apscheduler",
    "pydantic",
    "structlog",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.scripts]
factory = "factory.main:main"

# Even our own reader arrives through the socket. Importing it by name inside `witness/`
# would be a back door, and the first thing to use it would be the next reader somebody
# was in a hurry to add.
[project.entry-points."factory.witness.readers"]
fetched = "factory.witness.readers.fetched:Fetched"

[dependency-groups]
dev = ["ruff", "pytest"]
# `outside-reader` is not a dependency of the product. It is a reader published from
# outside the tree, so `evals/witness/socket_eval.py` can prove the entry point group is a
# socket rather than a decoration.
evals = ["inspect-ai", "outside-reader"]

[tool.uv.sources]
outside-reader = { path = "evals/witness/outside", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
# Real directories. A testpaths naming a directory with no tests exits 5 and reads
# as silence rather than as a red suite.
testpaths = ["factory", "evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
